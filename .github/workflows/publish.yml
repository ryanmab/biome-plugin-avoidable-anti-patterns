name: Publish

on:
  push:
    tags: ['v*']

env:
    node-version: 24.x

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --omit=dev

      - run: npm stage publish --provenance --access public

  github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ryanmab'

      - name: Install dependencies
        run: npm ci --omit=dev

      - run: npm pkg set name=@ryanmab/biome-plugin-avoidable-anti-patterns

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}